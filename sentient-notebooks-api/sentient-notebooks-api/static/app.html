<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentient Notebooks</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="logo mono" id="notebook-name">sentient-notebooks</div>
    <div class="topbar-right">
      <span id="quota-label"></span>
      <div class="quota-bar"><div class="quota-fill" id="quota-fill" style="width:0%"></div></div>
      <button id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="main-grid">
    <div class="sidebar">
      <h2>Files</h2>
      <div class="dropzone" id="dropzone">
        Drop a file here, or click to browse<br>
        <span class="hint">.pdf .txt .md .markdown .rst</span>
        <input type="file" id="file-input">
      </div>
      <div id="file-list"></div>

      <h2>Notes</h2>
      <button id="new-note-btn" style="width:100%; margin-bottom:10px;">+ New note</button>
      <div id="note-list"></div>
    </div>

    <div class="chat-panel">
      <div class="chat-log" id="chat-log"></div>

      <div class="chat-input-bar">
        <div class="chat-input-row">
          <div class="mode-toggle">
            <button class="mode-btn active" data-mode="files">Files</button>
            <button class="mode-btn" data-mode="web">Web</button>
            <button class="mode-btn" data-mode="both">Both</button>
          </div>
          <input type="text" id="chat-input" placeholder="Ask something...">
          <button class="primary" id="chat-send">Ask</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/app.js"></script>
</body>
</html>
