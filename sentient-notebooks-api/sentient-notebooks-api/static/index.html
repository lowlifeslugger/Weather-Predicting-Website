<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentient Notebooks</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-hero">
    <div class="logo mono">sentient-notebooks</div>
    <p>Drop in your files, write notes, ask questions. Everything you add gets indexed automatically so you can chat with it.</p>
  </div>

  <div class="auth-form-panel">
    <div class="tabs">
      <button class="tab active" id="tab-login">Log in</button>
      <button class="tab" id="tab-signup">Sign up</button>
    </div>

    <form id="form-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <div class="error-text" id="login-error"></div>
      <button type="submit" class="primary" id="login-submit" style="width:100%; margin-top:8px;">Log in</button>
    </form>

    <form id="form-signup" style="display:none;">
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signup-password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="error-text" id="signup-error"></div>
      <button type="submit" class="primary" id="signup-submit" style="width:100%; margin-top:8px;">Create account</button>
      <p class="hint" style="margin-top:12px;">Each account gets one notebook, automatically.</p>
    </form>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/login.js"></script>
</body>
</html>
