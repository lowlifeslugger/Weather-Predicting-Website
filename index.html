<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0120; --bg2: #1a0638; --ink: #fff6fb; --muted: #c9b0ff;
    --pink: #ff2d95; --cyan: #00f0ff; --yellow: #ffe600; --violet: #a56bff;
    --green: #19f5a1; --orange: #ff7a00; --red: #ff1744;
    --low: #19f5a1; --moderate: #ffe600; --high: #ff7a00; --veryhigh: #ff1744;
    --panel: rgba(14, 2, 36, .9); --line: rgba(255, 255, 255, .14);
    --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
    --font-body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Share Tech Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 25% 15%, #3b0a6e 0%, var(--bg) 55%, #04000d 100%);
    color: var(--ink); font-family: var(--font-body); line-height: 1.45; font-size: 16px;
  }
  /* VHS feel: faint scanlines and a dark vignette over everything */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px);
    box-shadow: inset 0 0 180px rgba(0,0,0,.65); }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 400; letter-spacing: .02em; line-height: 1.1; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .num, .val, .n, td, th, .mono { font-variant-numeric: tabular-nums; }

  /* ---- full-screen map ---- */
  #stage { position: fixed; inset: 0; z-index: 1;
    background-image: linear-gradient(rgba(0,240,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,45,149,.06) 1px, transparent 1px);
    background-size: 56px 56px; cursor: grab; }
  #stage.pinning { cursor: crosshair; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  .state { fill: #3a1580; stroke: var(--pink); stroke-opacity: .55; stroke-width: .8; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .12s; }
  .state[data-cont="Africa"] { fill: #7d2a74; }
  .state[data-cont="Asia"] { fill: #3d2c9a; }
  .state[data-cont="Europe"] { fill: #1f4fb0; }
  .state[data-cont="North America"] { fill: #6d1f98; }
  .state[data-cont="South America"] { fill: #8f2860; }
  .state[data-cont="Oceania"] { fill: #137a96; }
  .state.sub { stroke: var(--cyan); stroke-opacity: .8; }
  .state.sub[data-c="0"] { fill: #7a1fa2; } .state.sub[data-c="1"] { fill: #1f6fd0; } .state.sub[data-c="2"] { fill: #b01e6a; }
  .state.sub[data-c="3"] { fill: #0f8f8a; } .state.sub[data-c="4"] { fill: #c05a00; } .state.sub[data-c="5"] { fill: #5a2fd0; }
  .state.lyr { stroke: #0b0120; stroke-opacity: 1; stroke-width: 1; }
  .state:hover, .state.hot { filter: brightness(1.55) saturate(1.3); stroke: #fff; stroke-opacity: 1; stroke-width: 2; }
  .state.sel { stroke: var(--yellow); stroke-opacity: 1; stroke-width: 3; filter: drop-shadow(0 0 7px rgba(255,230,0,.8)); }
  .state.sel[data-risk="Low"] { fill: var(--low); } .state.sel[data-risk="Moderate"] { fill: var(--moderate); }
  .state.sel[data-risk="High"] { fill: var(--high); } .state.sel[data-risk="Very high"] { fill: var(--veryhigh); }
  .state.sel[data-risk="n/a"] { fill: #7c6aa8; }
  .marker { fill: var(--cyan); stroke: #0b0120; stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; }
  .marker:hover, .marker.hot { fill: #fff; stroke: var(--pink); stroke-width: 2.5; }
  .marker.sel { fill: var(--yellow); stroke: #fff; stroke-width: 2.5; }
  .marker.sel[data-risk="Low"] { fill: var(--low); } .marker.sel[data-risk="Moderate"] { fill: var(--moderate); }
  .marker.sel[data-risk="High"] { fill: var(--high); } .marker.sel[data-risk="Very high"] { fill: var(--veryhigh); }
  .spt { fill: var(--yellow); stroke: #0b0120; stroke-width: 1.6; vector-effect: non-scaling-stroke; pointer-events: none; }
  .pinring { fill: none; stroke: var(--yellow); stroke-width: 2.4; vector-effect: non-scaling-stroke; pointer-events: none; }
  .pindot { fill: var(--pink); pointer-events: none; }
  .tip { position: fixed; z-index: 70; pointer-events: none; background: var(--pink); color: #12002b; padding: .25rem .6rem; font-weight: 700;
         box-shadow: 3px 3px 0 var(--cyan); white-space: nowrap; transform: translate(14px, -140%); opacity: 0; transition: opacity .1s; }
  .tip.on { opacity: 1; }

  /* ---- floating HUD ---- */
  .hud { position: fixed; z-index: 20; }
  .brand { left: 16px; top: 12px; max-width: min(480px, calc(100vw - 500px)); padding: .5rem .9rem .65rem; border-left: 4px solid var(--pink);
           background: linear-gradient(180deg, rgba(11,1,32,.85), rgba(11,1,32,.6)); }
  body.zoomed .brand p { display: none; }
  body.zoomed .brand h1 { font-size: clamp(1.05rem, 1.7vw, 1.5rem); }
  body.zoomed .calib { margin-top: .4rem; }
  .brand h1 { font-size: clamp(1.5rem, 2.8vw, 2.5rem); color: var(--pink); text-transform: uppercase;
              text-shadow: 3px 3px 0 var(--cyan), 0 0 22px rgba(255,45,149,.65); }
  .brand p { margin: .55rem 0 0; color: var(--muted); font-size: .95rem; text-shadow: 0 1px 4px #000; }
  .calib { display: inline-flex; align-items: center; gap: .5rem; margin-top: .7rem; padding: .3rem .7rem; font-size: .85rem;
           background: var(--panel); border: 1.5px solid var(--cyan); box-shadow: 3px 3px 0 var(--pink); }
  .dot { width: .7rem; height: .7rem; background: var(--muted); flex: none; transform: rotate(45deg); }
  .dot.ok { background: var(--green); } .dot.warn { background: var(--yellow); }
  .zoomctl { left: 22px; bottom: 22px; display: flex; flex-direction: column; gap: .4rem; }
  .zoomctl button { width: 2.5rem; height: 2.5rem; background: var(--panel); border: 2px solid var(--cyan); color: var(--cyan);
                    font-family: var(--font-display); font-size: 1.1rem; cursor: pointer; padding: 0; box-shadow: 3px 3px 0 var(--pink); }
  .zoomctl button:hover { background: var(--cyan); color: #12002b; }
  .zoomctl .rs { font-size: .65rem; }
  .layerbox { left: 84px; bottom: 22px; right: calc(min(450px, 100vw - 32px) + 48px); padding: .55rem .9rem .6rem;
              background: var(--panel); border: 2px solid var(--pink); box-shadow: 5px 5px 0 var(--cyan); }
  body.panel-off .layerbox { right: 170px; }
  .layerbox[hidden], .legend[hidden], #layerLegend[hidden] { display: none; }
  .layerbox h3 { font-size: .85rem; color: var(--yellow); margin-bottom: .35rem; }
  .layerbox label { display: block; font-weight: 700; font-size: .72rem; color: var(--muted); margin: 0 0 .15rem; text-transform: uppercase; letter-spacing: .06em; }
  .lb-row { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: flex-end; }
  .lb-row select { width: 17rem; max-width: 100%; } .lb-row input[type="date"] { width: 10.5rem; }
  .lb-row .chip { padding: .45rem .9rem; }
  .lb-side { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; align-items: center; margin-top: .45rem; }
  .lb-side .hint { margin: 0; flex: 1 1 14rem; }
  #layerLegend { flex: 1 1 14rem; min-width: 12rem; }
  .ramp { height: 12px; border: 1.5px solid #fff; }
  .rl { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: .85rem; margin-top: .15rem; }
  body.has-layer .legend { bottom: 152px; }
  .legend { left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: .3rem 1rem; justify-content: center;
            padding: .4rem .9rem; background: var(--panel); border: 1.5px solid var(--cyan); font-size: .85rem; }
  .legend i { display: inline-block; width: .8rem; height: .8rem; margin-right: .35rem; vertical-align: -1px; border: 1px solid #fff; }
  .paneltoggle { right: 22px; bottom: 22px; background: var(--pink); color: #12002b; border: 0; padding: .55rem 1rem; font-family: var(--font-display);
                 font-size: .8rem; cursor: pointer; box-shadow: 4px 4px 0 var(--cyan); z-index: 30; }
  .paneltoggle:hover { background: var(--cyan); }

  /* ---- side panel ---- */
  .panel { position: fixed; z-index: 25; top: 16px; right: 16px; bottom: 70px; width: min(450px, calc(100vw - 32px)); overflow-y: auto;
           padding: 1.1rem 1.2rem 1.4rem; background: var(--panel); border: 2px solid var(--pink); box-shadow: 7px 7px 0 var(--cyan); }
  body.panel-off .panel { display: none; }
  .panel::-webkit-scrollbar { width: 9px; } .panel::-webkit-scrollbar-thumb { background: var(--pink); }
  .panel h2 { font-size: 1.7rem; color: var(--cyan); text-shadow: 2px 2px 0 var(--pink); margin-bottom: .25rem; word-break: break-word; }
  .field { display: flex; flex-direction: column; gap: .3rem; margin: .9rem 0; }
  .field[hidden], #ask[hidden] { display: none; }
  .field label { font-weight: 700; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  select, input[type="date"], input[type="search"], input[type="number"] {
    background: #1d0840; border: 2px solid var(--violet); padding: .55rem .7rem; width: 100%; color: var(--ink); color-scheme: dark; }
  select:focus, input:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px rgba(0,240,255,.35); }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .go { background: var(--pink); color: #12002b; border: 0; padding: .7rem 1.3rem; font-family: var(--font-display); font-size: .95rem; cursor: pointer; box-shadow: 4px 4px 0 var(--cyan); }
  .go:hover { background: var(--yellow); }
  .go[disabled] { opacity: .55; cursor: progress; }
  .chip { background: transparent; border: 2px solid var(--violet); padding: .3rem .85rem; font-size: .85rem; font-weight: 700; cursor: pointer; }
  .chip:hover { border-color: var(--cyan); color: var(--cyan); }
  .chip[aria-pressed="true"] { background: var(--cyan); color: #12002b; border-color: var(--cyan); }
  .hint { color: var(--muted); font-size: .88rem; margin: .25rem 0 0; }
  .tabs { display: flex; gap: .3rem; border-bottom: 2px solid var(--violet); margin: 1rem 0 0; }
  .tab { background: none; border: 0; border-bottom: 4px solid transparent; padding: .5rem .9rem; font-family: var(--font-display); font-size: .85rem; color: var(--muted); cursor: pointer; margin-bottom: -2px; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--yellow); border-bottom-color: var(--pink); }
  [role="tabpanel"][hidden] { display: none; }
  .coords { display: grid; grid-template-columns: 1fr 1fr auto; gap: .5rem; align-items: end; margin-top: .6rem; }
  .coords[hidden], .hint[hidden] { display: none; }
  .coords label { font-weight: 700; font-size: .78rem; color: var(--muted); display: block; margin-bottom: .2rem; text-transform: uppercase; }
  .busy { margin-top: 1.3rem; }
  .busy .bar { height: 5px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: .6rem; }
  .busy .bar::after { content: ""; display: block; height: 100%; width: 35%; background: var(--pink); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .busy .bar::after { animation: none; width: 100%; opacity: .5; } .state, .tip { transition: none; } }
  .error { margin-top: 1.2rem; border-left: 5px solid var(--red); padding: .5rem .9rem; background: rgba(255,23,68,.18); }

  .result { margin-top: 1.2rem; }
  .result section { border-top: 2px solid var(--violet); padding: 1rem 0 .3rem; margin-top: 1rem; }
  .result h3 { font-size: 1.05rem; color: var(--yellow); margin-bottom: .55rem; }
  .when { color: var(--muted); margin: 0; }
  .riskline { display: flex; align-items: center; gap: .7rem; margin: 1rem 0 .2rem; }
  .riskchip { width: 1.2rem; height: 1.2rem; flex: none; border: 2px solid #fff; transform: rotate(45deg); }
  .riskline strong { font-family: var(--font-display); font-size: 1.45rem; font-weight: 400; }
  .why { margin: 0; color: var(--muted); }
  .chance { margin: .85rem 0; }
  .chance .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .chance .name { font-weight: 700; }
  .chance .mm { color: var(--muted); font-size: .85rem; margin-left: .35rem; font-weight: 400; }
  .chance .val { font-family: var(--font-mono); font-size: 1.5rem; color: var(--cyan); }
  .track { position: relative; height: 12px; background: rgba(255,255,255,.12); margin: .35rem 0 .2rem; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  .fill.raw { background: var(--violet); }
  .tick { position: absolute; top: -5px; width: 3px; height: 22px; background: var(--yellow); transform: translateX(-1px); }
  .skill { font-size: .82rem; color: var(--muted); }
  .skill.ok { color: var(--green); } .skill.warn { color: var(--yellow); } .skill.bad { color: #ff5c85; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th { text-align: left; font-weight: 700; color: var(--muted); padding: .25rem .5rem .25rem 0; font-size: .8rem; text-transform: uppercase; }
  td { padding: .25rem .5rem .25rem 0; border-top: 1px solid var(--line); font-family: var(--font-mono); }
  td:first-child { font-family: var(--font-body); }
  td.num, th.num { text-align: right; padding-right: 0; }
  .notes p { margin: 0 0 .6rem; font-size: .92rem; }
  .notes .warn, .warn { color: var(--yellow); }
  .scroll { overflow-x: auto; }
  .wxrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: .55rem 0; border-top: 1px solid var(--line); }
  .wxrow:first-of-type { border-top: 0; }
  .wxl { font-weight: 700; }
  .wxv { text-align: right; white-space: nowrap; }
  .wxv strong { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 400; color: var(--cyan); }
  .rng { color: var(--muted); font-size: .85rem; font-family: var(--font-mono); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: .75rem 1rem; margin: 1rem 0; }
  .stat .k { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .stat .n { font-family: var(--font-mono); font-size: 1.45rem; color: var(--yellow); }
  .cht { margin: 1.1rem 0 .4rem; }
  .cht h3 { font-size: .95rem; margin-bottom: .15rem; }
  .cht svg { display: block; width: 100%; height: auto; }
  .cht .ax { font-size: 10px; fill: var(--muted); font-family: var(--font-mono); }
  .cht .gl { stroke: rgba(255,255,255,.14); stroke-width: 1; }
  .key { display: flex; flex-wrap: wrap; gap: .2rem 1rem; font-size: .82rem; color: var(--muted); }
  .key i { display: inline-block; width: .8rem; height: .25rem; margin-right: .35rem; vertical-align: middle; }
  .key i.bar { height: .7rem; width: .7rem; vertical-align: -1px; }
  .tablewrap { max-height: 18rem; overflow: auto; border: 1.5px solid var(--violet); margin-top: .6rem; }
  .tablewrap table { font-size: .85rem; }
  .tablewrap th { position: sticky; top: 0; background: #1d0840; z-index: 1; padding: .35rem .5rem; }
  .tablewrap td { padding: .25rem .5rem; white-space: nowrap; }
  .dl { margin-top: .7rem; }

  @media (max-width: 900px) {
    .brand { max-width: calc(100vw - 44px); }
    .brand p { display: none; }
    .brand { max-width: calc(100vw - 32px); }
    .panel { top: auto; left: 12px; right: 12px; bottom: 64px; width: auto; max-height: 52vh; }
    .layerbox { left: 12px; right: 12px; bottom: 64px; }
    body.panel-off .layerbox { right: 12px; }
    .zoomctl { left: 12px; bottom: 12px; flex-direction: row; }
    body.has-layer .zoomctl { bottom: 150px; }
    .paneltoggle { right: 12px; bottom: 12px; }
    .legend { display: none; }
  }
  /* day / night */
  .dn { left: 50%; top: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; padding: .4rem .8rem;
        background: var(--panel); border: 2px solid var(--yellow); box-shadow: 4px 4px 0 var(--pink); font-size: .82rem; max-width: 520px; }
  .dn[hidden] { display: none; }
  .dn .chip { padding: .2rem .6rem; font-size: .78rem; }
  .dn input[type="range"] { width: 150px; accent-color: var(--pink); padding: 0; }
  #dnTime { font-family: var(--font-mono); color: var(--yellow); min-width: 9.5rem; } #dnSun { font-family: var(--font-mono); color: var(--muted); font-size: .75rem; }
  .dnlights { mix-blend-mode: screen; }
  .dnlights .fl { animation: dnflash 2.4s ease-in-out infinite alternate; }
  @keyframes dnflash { 0% { opacity: .35; } 35% { opacity: 1; } 55% { opacity: .55; } 100% { opacity: .95; } }
  @media (prefers-reduced-motion: reduce) { .dnlights .fl { animation: none; } }
  @media (max-width: 1250px) { .dn { left: 16px; top: 74px; transform: none; max-width: calc(100vw - 32px); } }
  .state:not(.sub):not(.hot):not(.sel):not(:hover) { stroke-opacity: .8; }
  .x-closed { display: none !important; }
  #dock { position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 35; display: flex; flex-direction: column; gap: .3rem; }
  #dock .chip { background: var(--panel); font-family: var(--font-display); font-size: .6rem; letter-spacing: .04em; padding: .4rem .55rem; border-left: 0; text-align: left; width: 4.6rem; }
  #dock .chip[aria-pressed="true"] { background: var(--cyan); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="tip" id="tip"></div>

<header class="hud brand">
  <h1 id="siteTitle">Weather outlook</h1>
  <p id="siteIntro">Pick a place on the map.</p>
  <div class="calib" id="calib"><span class="dot"></span><span>Checking the server</span></div>
</header>

<div class="hud zoomctl" id="zoomctl">
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
  <button type="button" id="zreset" class="rs" aria-label="Reset the map view">ALL</button>
</div>

<div class="hud layerbox" id="layerBox" hidden>
  <h3 id="layerTitle">Map layer</h3>
  <div class="lb-row">
    <div><label for="layerVar">Colour the map by</label><select id="layerVar"></select></div>
    <div><label for="layerDate">Day</label><input type="date" id="layerDate"></div>
    <button class="chip" id="layerZoom" type="button">Zoom there</button>
  </div>
  <div class="lb-side">
    <p class="hint" id="layerStatus"></p>
    <div id="layerLegend" hidden><div class="ramp" id="ramp"></div><div class="rl"><span id="rampMin"></span><span id="rampMax"></span></div></div>
  </div>
</div>

<div class="hud legend" id="legend" hidden>
  <span>Risk for the chosen day:</span>
  <span><i style="background:var(--low)"></i>Low</span>
  <span><i style="background:var(--moderate)"></i>Moderate</span>
  <span><i style="background:var(--high)"></i>High</span>
  <span><i style="background:var(--veryhigh)"></i>Very high</span>
</div>

<div class="hud dn" id="dn">
  <button class="chip" id="dnToggle" type="button" aria-pressed="true">Night: on</button>
  <span id="dnTime">UTC</span>
  <input type="range" id="dnSlide" min="-720" max="720" step="15" value="0" aria-label="Shift the time of day, in minutes">
  <button class="chip" id="dnLive" type="button">Live</button>
  <span id="dnSun"></span>
</div>

<nav id="dock" aria-label="Show or hide panels"></nav>

<button class="hud paneltoggle" id="panelToggle" type="button" aria-expanded="true">Hide panel</button>

<aside class="panel" id="panel" aria-live="polite">
  <div class="field" id="searchField" hidden>
    <label for="search" id="searchLabel">Search</label>
    <input type="search" id="search" list="regionList" autocomplete="off" placeholder="Type a name">
    <datalist id="regionList"></datalist>
  </div>
  <div class="field">
    <label for="stateSel" id="selLabel">State or union territory</label>
    <select id="stateSel"><option value="">Choose one</option></select>
  </div>
  <div class="field" id="pinBox" hidden>
    <button class="chip" id="pinToggle" aria-pressed="false" type="button">Pick any spot on the map</button>
    <p class="hint" id="pinHelp" hidden>Click anywhere on the map, or type coordinates. Spots are not calibrated.</p>
    <div class="coords" id="pinInputs" hidden>
      <div><label for="latIn">Latitude</label><input type="number" id="latIn" min="-90" max="90" step="0.01" placeholder="e.g. 15.49"></div>
      <div><label for="lonIn">Longitude</label><input type="number" id="lonIn" min="-180" max="180" step="0.01" placeholder="e.g. 73.83"></div>
      <button class="chip" id="pinGo" type="button">Go</button>
    </div>
  </div>
  <div id="ask" hidden>
    <h2 id="stateName"></h2>
    <p class="hint" id="pointsNote"></p>
    <div class="tabs" role="tablist" aria-label="What to show">

  function selectSpot(lat, lon, countryId) {

  /* ====================== colour layer (India's states) ====================== */
  var STOPS = [[0, [60, 70, 255]], [0.34, [0, 240, 255]], [0.67, [255, 230, 0]], [1, [255, 45, 149]]];
  function ramp(t) {
    t = Math.max(0, Math.min(1, t));
    for (var i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) {
      var a = STOPS[i - 1], b = STOPS[i], f = (t - a[0]) / (b[0] - a[0]);
      return "rgb(" + [0, 1, 2].map(function (j) { return Math.round(a[1][j] + (b[1][j] - a[1][j]) * f); }).join(",") + ")";
    }

  }
  function layerIds() { return layers.length ? layers[0].ids : []; }
  function clearLayerPaint() {
    layerIds().forEach(function (id) {

    });
    $("#layerLegend").hidden = true; layerActive = false;
  }
  function paintLayer() {
    var def = layerData.vars.filter(function (x) { return x.key === layerVar; })[0];
    var vals = layerIds().map(function (id) { return layerData.values[id] ? layerData.values[id][layerVar] : null; }).filter(function (v) { return v != null; });
    if (!vals.length) {
      clearLayerPaint();
      $("#layerStatus").textContent = layerVar === "local" && !layerData.calibrated
        ? "That layer needs a calibration file. Run the backtest first." : "No values came back for this layer.";
      return;
    }
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals); if (hi - lo < 1e-9) hi = lo + 1;
    layerIds().forEach(function (id) {
      var v = layerData.values[id] ? layerData.values[id][layerVar] : null, col = v == null ? "#4a3a78" : ramp((v - lo) / (hi - lo));
      if (paths[id]) paths[id].style.fill = col; if (markers[id]) markers[id].style.fill = col;
    });
    layerActive = true;
    $("#ramp").style.background = "linear-gradient(90deg," + STOPS.map(function (s) { return "rgb(" + s[1].join(",") + ") " + Math.round(s[0] * 100) + "%"; }).join(",") + ")";
    var u = def.unit === "%" ? "%" : " " + def.unit;
    $("#rampMin").textContent = lo.toFixed(def.dp) + u; $("#rampMax").textContent = hi.toFixed(def.dp) + u;
    $("#layerLegend").hidden = false;
    $("#layerStatus").textContent = layerData.places + " places, " + layerData.date + (layerData.calibrated ? "" : ". Raw model values.");
    // a selected state keeps its outline, but risk colours would hide the layer
    Object.keys(paths).forEach(function (k) { paths[k].removeAttribute("data-risk"); });
    Object.keys(markers).forEach(function (k) { markers[k].removeAttribute("data-risk"); });
  }
  function applyLayer() {

    var d = $("#layerDate").value;

    var my = ++layerReq;
    $("#layerStatus").textContent = "Loading conditions for every state. This can take about a minute.";
    getJSON("/api/layer?parent=" + encodeURIComponent(layers[0].parent) + "&date=" + encodeURIComponent(d))

      .catch(function (err) {

      });
  }
  function setupLayer() {

  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  /* ---------- tabs ---------- */

    $("#tabF").tabIndex = f ? 0 : -1; $("#tabH").tabIndex = f ? -1 : 0;
    $("#paneF").hidden = !f; $("#paneH").hidden = f;

  /* ---------- forecast ---------- */
  function run() {
    if (!selected && !custom) return;
    var d = $("#date").value;
    if (!d) { showError("Choose a date first."); return; }
    var my = ++reqId;
    $("#go").disabled = true;
    $("#out").innerHTML = '<div class="busy"><div>Fetching the forecast. This can take up to 20 seconds.</div><div class="bar"></div></div>';
    getJSON("/api/forecast?" + qs() + "&date=" + encodeURIComponent(d))
      .then(function (data) { if (my === reqId) render(data); })
      .catch(function (err) {
        if (my !== reqId) return;
        showError(err instanceof TypeError ? "Can't reach the local server. Check that server.py is still running, then try again." : err.message);
      })

  }
  function showError(msg) { $("#out").innerHTML = '<div class="error" role="alert">' + esc(msg) + "</div>"; }

  var ROWS = [
    { key: "rain", label: "Any rain", raw: "p_rain" },
    { key: "moderate", label: "Moderate rain or more", raw: null },
    { key: "local", label: "Locally heavy rain", raw: "p_local" },
    { key: "heavy", label: "Heavy rain (IMD class)", raw: "p_heavy" }

  var SKILL = {

    "no skill": ["Backtest: no skill", "bad"], "too few events": ["Backtest: too few events to judge", ""],
    "not scored": ["Not scored in the backtest", ""]
  };
  var RISKCOL = { "Low": "--low", "Moderate": "--moderate", "High": "--high", "Very high": "--veryhigh", "n/a": "--muted" };

  function render(d) {
    var cal = d.calibrated, ens = d.ensemble, calOn = d.calibration.status === "calibrated";
    var when = new Date(d.date + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    var npts = d.points.length;
    var h = "";

    h += '<div class="result">';
    h += '<p class="when">' + esc(when) + ", " + d.lead_days + (d.lead_days === 1 ? " day" : " days") + " ahead</p>";

    // risk
    var label = d.risk.label;
    h += '<div class="riskline"><span class="riskchip" style="background:var(' + (RISKCOL[label] || "--muted") + ')"></span>' +
         "<strong>" + esc(label === "n/a" ? "Risk unknown" : label + " risk") + "</strong></div>";
    h += '<p class="why">' + (d.risk.percent == null
        ? "No forecast data was available to rate the risk."
        : "Based on a " + pct(d.risk.percent) + " chance of " + d.events.local + " mm or more at " +
          (custom ? "this spot" : npts > 1 ? "any of the " + curRW + "'s " + npts + " places" : "the " + curRW + "'s main city") + " (" + esc(d.risk.source) + ").") + "</p>";

    // chances

      var primary = calOn && cal ? cal[r.key] : (ens && r.raw ? ens[r.raw] : null);
      var rawv = (calOn && ens && r.raw) ? ens[r.raw] : null;
      var w = primary == null ? 0 : Math.max(primary, primary > 0 ? 1 : 0);
      var sk = calOn ? (SKILL[d.calibration.skill[r.key]] || SKILL["not scored"]) : null;

  var SKILLW = { "useful": ["Backtest: useful", "ok"], "marginal": ["Backtest: marginal", "warn"],

                 "not scored": ["Not scored", ""] };

  function renderWeather(d) {
    var rows = (d.weather || []).filter(function (w) { return w.value != null; });
    if (!rows.length) return '<section><h3>Weather for the day</h3><p class="hint">No weather values came back.</p></section>';
    var h = "<section><h3>Weather for the day</h3>";
    rows.forEach(function (w) {
      var sk = w.verdict ? (SKILLW[w.verdict] || SKILLW["not scored"]) : null;
      h += '<div class="wxrow"><div class="wxl">' + esc(w.label) +
           (sk ? '<div class="skill ' + sk[1] + '">' + esc(sk[0]) + "</div>" : "") + "</div>" +
           '<div class="wxv"><strong>' + num(w.value, w.dp) + (w.unit === "%" ? "" : " ") + esc(w.unit) + "</strong>" +
           (w.low != null ? '<div class="rng">likely ' + num(w.low, w.dp) + " to " + num(w.high, w.dp) + "</div>" : "") + "</div></div>";
    });

  function placeTable(d) {

    var pts = d.points.slice().sort(function (a, b) { return (b.rain_mm || 0) - (a.rain_mm || 0); });

  /* ---------- past data ---------- */

    getJSON("/api/history?" + qs() + "&days=" + histDays)

      .catch(function (err) {

        $("#histOut").innerHTML = '<div class="error" role="alert">' + esc(err instanceof TypeError
          ? "Can't reach the local server. Check that server.py is still running, then try again." : err.message) + "</div>";
      });

  function shortDate(iso) { return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }); }
  function avg(a) { var v = a.filter(function (x) { return x != null; }); return v.length ? v.reduce(function (p, c) { return p + c; }, 0) / v.length : null; }
  function sum(a) { var v = a.filter(function (x) { return x != null; }); return v.length ? v.reduce(function (p, c) { return p + c; }, 0) : null; }

  function chart(o) {
    var W = 460, H = 150, L = 40, R = 8, T = 10, B = 22, n = o.dates.length, all = [];
    o.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null) all.push(v); }); });
    if (!all.length) return '<div class="cht"><h3>' + esc(o.title) + '</h3><p class="hint">No data available for this.</p></div>';
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (o.zero) lo = Math.min(0, lo);
    if (hi - lo < 1e-9) { hi = lo + 1; }
    var pad = (hi - lo) * 0.08; hi += pad; if (!o.zero) lo -= pad;
    var iw = W - L - R, ih = H - T - B;
    var X = function (i) { return L + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
    var Y = function (v) { return T + ih * (1 - (v - lo) / (hi - lo)); };
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(o.title) + '">';
    [0, 0.5, 1].forEach(function (f) {
      var v = lo + (hi - lo) * f, y = Y(v);
      svg += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>' +
             '<text class="ax" x="' + (L - 5) + '" y="' + (y + 3) + '" text-anchor="end">' + v.toFixed(o.dp) + "</text>";
    });
    svg += '<text class="ax" x="' + L + '" y="' + (H - 6) + '">' + shortDate(o.dates[0]) + "</text>" +
           '<text class="ax" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + shortDate(o.dates[n - 1]) + "</text>";
    o.series.forEach(function (s) {
      if (s.kind === "bar") {
        var bw = Math.max(1.5, iw / n * 0.72);
        s.values.forEach(function (v, i) {
          if (v == null) return;
          var y = Y(v), y0 = Y(Math.max(lo, 0));
          svg += '<rect x="' + (X(i) - bw / 2) + '" y="' + Math.min(y, y0) + '" width="' + bw + '" height="' + Math.max(0.5, Math.abs(y0 - y)) +
                 '" fill="' + s.color + '"><title>' + shortDate(o.dates[i]) + ": " + v.toFixed(o.dp) + " " + o.unit + "</title></rect>";
        });
      } else if (s.kind === "dot") {
        s.values.forEach(function (v, i) {
          if (v == null || v <= 0) return;
          svg += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="2.2" fill="' + s.color + '"><title>' + shortDate(o.dates[i]) + " " + esc(s.label) + ": " + v.toFixed(o.dp) + " " + o.unit + "</title></circle>";
        });
      } else {
        var d = "", pen = false;
        s.values.forEach(function (v, i) {
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); pen = true;
        });
        svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
        if (n <= 31) s.values.forEach(function (v, i) {
          if (v != null) svg += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="2" fill="' + s.color + '"><title>' + shortDate(o.dates[i]) + " " + esc(s.label) + ": " + v.toFixed(o.dp) + " " + o.unit + "</title></circle>";
        });
      }
    });
    svg += "</svg>";
    var key = '<div class="key">' + o.series.map(function (s) {
      return "<span><i" + (s.kind === "bar" || s.kind === "dot" ? ' class="bar"' : "") + ' style="background:' + s.color + '"></i>' + esc(s.label) + "</span>";
    }).join("") + "</div>";
    return '<div class="cht"><h3>' + esc(o.title) + "</h3>" + key + svg + "</div>";
  }

  function renderHistory(d) {
    var S = d.series, V = d.variables, dates = d.dates;
    var h = '<div class="stats">';
    function stat(k, v) { h += '<div class="stat"><div class="k">' + esc(k) + '</div><div class="n">' + v + "</div></div>"; }
    stat("Average high", avg(S.tmax) == null ? "n/a" : avg(S.tmax).toFixed(1) + " \u00b0C");
    stat("Average low", avg(S.tmin) == null ? "n/a" : avg(S.tmin).toFixed(1) + " \u00b0C");
    stat("Total rain", sum(S.rain_mean) == null ? "n/a" : Math.round(sum(S.rain_mean)) + " mm");
    var wet = S.rain_max.reduce(function (b, v, i) { return v != null && (b < 0 || v > S.rain_max[b]) ? i : b; }, -1);
    stat("Wettest day", wet < 0 ? "n/a" : S.rain_max[wet].toFixed(0) + " mm");
    stat("Humidity", avg(S.rh) == null ? "n/a" : Math.round(avg(S.rh)) + "%");
    stat("Sunshine", avg(S.sun) == null ? "n/a" : avg(S.sun).toFixed(1) + " h/day");
    h += "</div>";
    h += '<p class="hint">' + (custom ? "Values for this one spot." : "Rain total is the average of the " + curRW + "'s " + d.n_points + " place(s). Wettest day is the highest single-place total.") + "</p>";

    h += chart({ title: "Temperature", unit: "\u00b0C", dp: 1, dates: dates, series: [
      { label: "Daily high", values: S.tmax, color: "#ff2d95", kind: "line" },
      { label: "Daily low", values: S.tmin, color: "#00f0ff", kind: "line" }] });
    h += chart({ title: "Rain", unit: "mm", dp: 1, zero: true, dates: dates, series: [
      { label: "Average of places", values: S.rain_mean, color: "#00f0ff", kind: "bar" },
      { label: "Wettest place", values: S.rain_max, color: "#ffe600", kind: "dot" }] });
    h += chart({ title: "Humidity", unit: "%", dp: 0, dates: dates, series: [
      { label: "Daily average", values: S.rh, color: "#19f5a1", kind: "line" }] });
    h += chart({ title: "Wind", unit: "km/h", dp: 0, dates: dates, series: [
      { label: "Peak wind", values: S.wind, color: "#ff2d95", kind: "line" },
      { label: "Peak gust", values: S.gust, color: "#ffe600", kind: "line" }] });
    h += chart({ title: "Sunshine", unit: "h", dp: 1, zero: true, dates: dates, series: [
      { label: "Hours of sun", values: S.sun, color: "#ffe600", kind: "bar" }] });

    h += '<button class="chip dl" id="csv" type="button">Download as CSV</button>';
    h += '<div class="tablewrap"><table><thead><tr><th>Date</th><th class="num">High</th><th class="num">Low</th><th class="num">Hum %</th>' +
         '<th class="num">Wind</th><th class="num">Gust</th><th class="num">Sun h</th><th class="num">Cloud %</th><th class="num">Rain avg</th><th class="num">Rain max</th></tr></thead><tbody>';
    for (var i = dates.length - 1; i >= 0; i--) {
      h += "<tr><td>" + shortDate(dates[i]) + '</td><td class="num">' + num(S.tmax[i]) + '</td><td class="num">' + num(S.tmin[i]) +
           '</td><td class="num">' + num(S.rh[i], 0) + '</td><td class="num">' + num(S.wind[i], 0) + '</td><td class="num">' + num(S.gust[i], 0) +
           '</td><td class="num">' + num(S.sun[i]) + '</td><td class="num">' + num(S.cloud[i], 0) + '</td><td class="num">' + num(S.rain_mean[i]) +
           '</td><td class="num">' + num(S.rain_max[i]) + "</td></tr>";
    }
    h += "</tbody></table></div>";
    h += '<p class="hint" style="margin-top:.7rem">' + esc(d.source) + "</p>";
    $("#histOut").innerHTML = h;
    reveal($("#histOut"));
    $("#csv").addEventListener("click", function () { downloadCSV(d); });
  }

  function downloadCSV(d) {
    var S = d.series, rows = ["date,max_temp_C,min_temp_C,humidity_pct,wind_kmh,gust_kmh,sunshine_h,cloud_pct,rain_avg_mm,rain_max_mm"];
    d.dates.forEach(function (dt, i) {
      rows.push([dt, S.tmax[i], S.tmin[i], S.rh[i], S.wind[i], S.gust[i], S.sun[i], S.cloud[i], S.rain_mean[i], S.rain_max[i]]
        .map(function (v) { return v == null ? "" : v; }).join(","));
    });
    var blob = new Blob([rows.join("\n")], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = d.state.replace(/[^A-Za-z0-9]+/g, "_") + "_last_" + d.dates.length + "_days.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ====================== start ====================== */
  function init() {
    getJSON("/api/info").then(function (inf) {
      info = inf;
      return getJSON(info.map || "/india_states.json");
    }).then(function (m) {
      map = m;
      RW = info.site.region_word;
      var plural = info.site.region_plural || RW + "s";
      document.title = info.site.title;
      $("#siteTitle").textContent = info.site.title; $("#siteIntro").textContent = info.site.intro;
      $("#selLabel").textContent = info.site.select_label;
      $("#searchLabel").textContent = "Search " + plural;
      $("#search").placeholder = "Type a " + RW + " name";

      var sel = $("#stateSel");
      sel.innerHTML = '<option value="">Choose a ' + RW + "</option>";
      var sorted = info.states.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
      if (sorted.some(function (s) { return s.continent; })) {
        var groups = {};
        sorted.forEach(function (s) {
          var g = s.parent ? s.parent + " (states)" : (s.continent || "Other");
          (groups[g] = groups[g] || []).push(s);
        });
        Object.keys(groups).sort().forEach(function (g) {
          var og = document.createElement("optgroup"); og.label = g;
          groups[g].forEach(function (s) { var o = document.createElement("option"); o.value = s.id; o.textContent = s.name; og.appendChild(o); });
          sel.appendChild(og);
        });
      } else {
        sorted.forEach(function (s) { var o = document.createElement("option"); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
      }
      if (info.states.length > 40) {
        $("#searchField").hidden = false;
        var dl = $("#regionList");
        sorted.forEach(function (s) { var o = document.createElement("option"); o.value = s.name; dl.appendChild(o); });
        $("#search").addEventListener("input", function () {
          var v = this.value.trim().toLowerCase();
          var hit = info.states.filter(function (s) { return s.name.toLowerCase() === v; })[0];
          if (hit && hit.id !== selected) select(hit.id, true);
        });
      }
      var dt = $("#date"); dt.min = info.min_date; dt.max = info.max_date;
      buildMap();
      setupLayer();

      if (info.site.pin && map.proj) {
        $("#pinBox").hidden = false;
        $("#pinToggle").addEventListener("click", function () { setPinMode(!pinMode); });
        $("#pinGo").addEventListener("click", function () {
          var la = parseFloat($("#latIn").value), lo = parseFloat($("#lonIn").value);
          if (!isFinite(la) || !isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) {
            $("#pinHelp").hidden = false; $("#pinHelp").textContent = "Enter a latitude from -90 to 90 and a longitude from -180 to 180."; return;
          }
          selectSpot(la, lo, null);
          var xy = toXY(la, lo); flyTo([xy[0] - 7, xy[1] - 7, xy[0] + 7, xy[1] + 7]);
        });
      }

      sel.addEventListener("change", function () { select(sel.value, true); });
      $("#go").addEventListener("click", run);
      $("#tabF").addEventListener("click", function () { setTab("F"); });
      $("#tabH").addEventListener("click", function () { setTab("H"); });
      [$("#tabF"), $("#tabH")].forEach(function (b) {
        b.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") { setTab(tab === "F" ? "H" : "F"); $(tab === "F" ? "#tabF" : "#tabH").focus(); }
        });
      });
      $("#panelToggle").addEventListener("click", function () {
        var off = document.body.classList.toggle("panel-off");
        this.textContent = off ? "Show panel" : "Hide panel"; this.setAttribute("aria-expanded", String(!off));
      });

      var chipBox = $("#rangeChips");
      if (info.history_days.indexOf(histDays) < 0) histDays = info.history_days[0];
      info.history_days.forEach(function (n) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.dataset.days = n;
        b.setAttribute("aria-pressed", n === histDays);
        b.textContent = n === 365 ? "Last 12 months" : "Last " + n + " days";
        b.addEventListener("click", function () {
          histDays = n;
          document.querySelectorAll("[data-days]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
          histData = null; loadHistory();
        });
        chipBox.appendChild(b);
      });

      $("#date").addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
      document.querySelectorAll("[data-add]").forEach(function (b) {
        b.addEventListener("click", function () { setDate(parseInt(b.dataset.add, 10)); run(); });
      });
      var c = info.calibration, box = $("#calib");
      if (c && c.truth === "era5") {
        box.innerHTML = '<span class="dot warn"></span><span>Calibrated against ERA5 reanalysis, not stations. Built ' + esc(c.built_at) + "</span>";
      } else if (c) {
        box.innerHTML = '<span class="dot ok"></span><span>Calibrated on ' + esc(c.truth.toUpperCase()) + " data, built " + esc(c.built_at) + "</span>";
      } else {
        box.innerHTML = '<span class="dot warn"></span><span>Not calibrated yet: ' + esc(info.site.calib_hint || "run the backtest") + "</span>";
      }
    }).catch(function (err) {
      $("#calib").innerHTML = '<span class="dot warn"></span><span>Server problem</span>';
      $("#out").innerHTML = '<div class="error" role="alert">Could not load the page data (' + esc(err.message) +
        "). Make sure server.py is running and the map file is next to it.</div>";
      $("#ask").hidden = false; $("#emptyHint").hidden = true;
    });
  }
  init();
})();
</script>
<script>
(function () {
  var dock = document.getElementById("dock");
  function chip(label, onclick) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", "true"); b.addEventListener("click", onclick); dock.appendChild(b); return b;
  }
  [["Title", ".brand"], ["Time", "#dn"], ["Layers", "#layerBox"], ["Zoom", "#zoomctl"]].forEach(function (it) {
    var el = document.querySelector(it[1]); if (!el) return;
    var b = chip(it[0], function () { b.setAttribute("aria-pressed", String(!el.classList.toggle("x-closed"))); });
  });
  var pt = document.getElementById("panelToggle");
  var pb = chip("Panel", function () { pt.click(); });
  function sync() { pb.setAttribute("aria-pressed", String(!document.body.classList.contains("panel-off"))); }
  new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] }); sync();
})();
</script>
</body>
